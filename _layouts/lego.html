---
layout: default
---
<article class="article-detail">
    <a href="{{ '/lego' | relative_url }}" class="back-link">&larr; Back to LEGO</a>
    <h1 class="article-title">{{ page.title }}</h1>
    {% if page.description %}
    <p class="article-description">{{ page.description }}</p>
    {% endif %}
    <div class="article-body">
        {{ content }}
    </div>
</article>
