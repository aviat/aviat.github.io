title: Jb Aviat
description: Software securtiy engineer & entrepreneur
baseurl: ""
url: "https://aviat.github.io"

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Feed configuration - use articles collection
feed:
  collections:
    - articles

# Collections
collections:
  portfolio:
    output: true
  articles:
    output: true

# Defaults
defaults:
  - scope:
      path: ""
      type: "portfolio"
    values:
      layout: "portfolio-item"
  - scope:
      path: ""
      type: "articles"
    values:
      layout: "article"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - old

# Disable Sass processing
sass:
  load_paths: []
  style: compressed 
